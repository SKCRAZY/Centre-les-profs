name: Fix WhatsApp direct open

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'fix: WhatsApp student message with CLP and details'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch admin page
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/admin/page.tsx')
          s = p.read_text()

          old = """    e.currentTarget.reset(); setStudentLevel(''); await refresh();
    if (whatsappWindow && whatsappNumber) whatsappWindow.location.href = `https://wa.me/${whatsappNumber}`;"""

          new = """    if (whatsappWindow && whatsappNumber) {
      const subjectNames = subjectIds
        .map((id) => subjects.find((subject: any) => subject.id === id)?.name)
        .filter(Boolean)
        .join(', ') || 'Aucune';
      const clp = student.qr_code || 'Non disponible';
      const qrLink = clp ? `${window.location.origin}/eleve/${encodeURIComponent(clp)}` : '';
      const message = `السلام عليكم 👋%0A%0Aمرحباً بكم في Centre Les Profs 📚%0A%0Aتم تسجيل التلميذ بنجاح ✅%0A%0A👤 اسم التلميذ: ${full_name}%0A📱 رقم الهاتف: ${phone || 'غير متوفر'}%0A🎓 CLP: ${clp}%0A📚 المواد: ${subjectNames}%0A💰 المبلغ المؤدى: ${amount || 0} DH%0A📲 QR Code: ${qrLink}%0A%0Aنتمنى له مسيرة دراسية موفقة ونجاحاً دائماً 🎓✨%0A%0Aشكراً لثقتكم في Centre Les Profs ❤️`;
      whatsappWindow.location.href = `https://wa.me/${whatsappNumber}?text=${message}`;
    }
    e.currentTarget.reset(); setStudentLevel(''); await refresh();"""

          if old not in s:
              raise SystemExit('Expected WhatsApp ending not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin/page.tsx
          git diff --cached --quiet || git commit -m "fix: WhatsApp student message with CLP and details"
          git push
