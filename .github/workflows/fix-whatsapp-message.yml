name: Fix WhatsApp message

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch WhatsApp flow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/admin/page.tsx')
          s = p.read_text(encoding='utf-8')
          old = """    const whatsappNumber = normalizeWhatsAppPhone(phone);
    const whatsappWindow = whatsappNumber ? window.open(`https://wa.me/${whatsappNumber}`, '_blank') : null;
"""
          new = """    const whatsappNumber = normalizeWhatsAppPhone(phone);
"""
          if old not in s:
              print('Old WhatsApp opener not found; nothing to patch.')
              raise SystemExit(0)
          s = s.replace(old, new, 1)
          old2 = """    if (whatsappWindow && whatsappNumber) {
      const subjectNames = subjectIds
        .map((id) => subjects.find((subject: any) => String(subject.id) === String(id))?.name)
        .filter(Boolean)
        .join('، ') || 'Aucune';
      const clp = student.qr_code || 'Non disponible';
      const qrLink = clp ? `${window.location.origin}/eleve/${encodeURIComponent(clp)}` : '';
      const message = `السلام عليكم 👋\\n\\nمرحباً بكم في Centre Les Profs 📚\\n\\nتم تسجيل التلميذ بنجاح ✅\\n\\n👤 اسم التلميذ: ${full_name}\\n📱 رقم الهاتف: ${phone || 'غير متوفر'}\\n🎓 CLP: ${clp}\\n📚 المواد: ${subjectNames}\\n💰 المبلغ المؤدى: ${amount || 0} DH\\n📲 QR Code: ${qrLink || 'غير متوفر'}\\n\\nنتمنى له مسيرة دراسية موفقة ونجاحاً دائماً 🎓✨\\n\\nشكراً لثقتكم في Centre Les Profs ❤️`;
      whatsappWindow.location.href = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`;
    }
"""
          new2 = """    if (whatsappNumber) {
      const subjectNames = subjectIds
        .map((id) => subjects.find((subject: any) => String(subject.id) === String(id))?.name)
        .filter(Boolean)
        .join('، ') || 'Aucune';
      const clp = student.qr_code || 'Non disponible';
      const qrLink = clp ? `${window.location.origin}/eleve/${encodeURIComponent(clp)}` : '';
      const message = `السلام عليكم 👋\\n\\nمرحباً بكم في Centre Les Profs 📚\\n\\nتم تسجيل التلميذ بنجاح ✅\\n\\n👤 اسم التلميذ: ${full_name}\\n📱 رقم الهاتف: ${phone || 'غير متوفر'}\\n🎓 CLP: ${clp}\\n📚 المواد: ${subjectNames}\\n💰 المبلغ المؤدى: ${amount || 0} DH\\n📲 QR Code: ${qrLink || 'غير متوفر'}\\n\\nنتمنى له مسيرة دراسية موفقة ونجاحاً دائماً 🎓✨\\n\\nشكراً لثقتكم في Centre Les Profs ❤️`;
      window.location.href = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`;
    }
"""
          if old2 not in s:
              print('Old WhatsApp message block not found; nothing to patch.')
              raise SystemExit(0)
          s = s.replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- app/admin/page.tsx; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/admin/page.tsx
          git commit -m 'fix: open WhatsApp with prefilled student message'
          git push