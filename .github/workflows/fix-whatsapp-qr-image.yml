name: Fix WhatsApp QR image URL

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace QR site link with QR image URL
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/admin/page.tsx')
          s = p.read_text(encoding='utf-8')
          old = "const qrLink = clp ? `${window.location.origin}/eleve/${encodeURIComponent(clp)}` : '';"
          new = "const qrLink = clp ? `https://quickchart.io/qr?size=900&format=png&text=${encodeURIComponent(clp)}` : '';"
          if old not in s:
              raise SystemExit('QR link line not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/admin/page.tsx
          if git diff --cached --quiet; then
            echo 'No changes needed'
          else
            git commit -m 'fix: send QR image URL in WhatsApp message'
            git push
          fi
